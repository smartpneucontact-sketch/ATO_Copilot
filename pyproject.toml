[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ato-copilot"
version = "0.1.0"
description = "AI-assisted ATO/NTAP triage with ATL check, control mapping, and risk classification. Portfolio demo for State Street."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arsen Khanguieldyan" }]

dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ato_copilot"]
